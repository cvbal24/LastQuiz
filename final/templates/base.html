<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Welcome to Biyahero{% endblock %}</title>

  <!-- Bootstrap CSS -->
  <link href="/static/bootstrap/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #6c63ff; /* gradient fallback */
      background: linear-gradient(135deg, #6c63ff, #00b4d8, #0077b6);
      color: #fff;
    }

    .homepage-box {
      max-width: 400px;
      width: 100%;
      text-align: center;
      padding: 3rem 2rem;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    .homepage-box h1 {
      font-weight: 700;
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #fff;
    }

    .homepage-box p {
      font-size: 1.1rem;
      margin-bottom: 2rem;
      color: rgba(255,255,255,0.85);
    }

    .btn-homepage {
      border-radius: 50px;
      padding: 0.6rem 2rem;
      font-weight: 600;
      margin: 0.4rem;
      transition: all 0.2s;
    }
    .btn-signin {
      background-color: #fff;
      color: #6c63ff;
    }
    .btn-signup {
      background-color: #00b4d8;
      color: #fff;
    }
    .btn-signin:hover {
      background-color: #f0f0ff;
      color: #6c63ff;
    }
    .btn-signup:hover {
      background-color: #009ac4;
      color: #fff;
    }

    @media (max-width: 576px) {
      .btn-homepage {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="homepage-box">
    <h1>BiyaHero</h1>
    <p>Connecting people, one ride at a time.</p>
    <div>
                <div class="container-fluid">
                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>

  <div class="sidebar">
    {% block sidebar_menu %}{% endblock %}
</div>

  <script src="/static/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
